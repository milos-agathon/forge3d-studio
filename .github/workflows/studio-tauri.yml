name: Studio Tauri

on:
  pull_request:
  push:
    branches: [main]

jobs:
  studio-tauri:
    name: fmt · lint · types · node tests · Rust suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend types
        run: |
          npm ci
          npx tsc --noEmit

      - name: Frontend tests (viewport math, playback clock, render queue)
        run: npm test

      - name: VP-01 and VP-03 viewport probe unit tests
        run: node --test scripts/vp01/*.test.mjs scripts/vp03/*.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The shell crate links WebKitGTK: clippy --all-targets compiles it, so
      # the dev packages must be present here as they are in deb-audit.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: studio-core tests
        run: cargo test -p studio-core

      - name: Shell unit tests (render payload, view override)
        run: cargo test -p forge3d-studio-shell --lib

  studio-python:
    name: Python suites — render service, mesh composite, surface audit
    # These suites were left in the engine repo at the split. They are the only
    # end-to-end check that imported meshes reach the Rendered still, so they
    # gate PRs rather than waiting for a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the still tests read the real DEMs, not LFS pointer files

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engine and test deps
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # the wheel excludes the engine's LFS sample data
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev pkg-config
          python -m venv "$HOME/studio-venv"
          "$HOME/studio-venv/bin/python" -m pip install --upgrade pip
          "$HOME/studio-venv/bin/python" -m pip install \
            'forge3d @ git+https://github.com/milos-agathon/forge3d.git@9804091086364a1824ea8bb0e7f9f2a172fddf45' \
            pytest pillow rasterio pyproj

      - name: pytest
        run: |
          "$HOME/studio-venv/bin/python" -m pytest tests/ -q

  studio-python-gpu:
    name: Trusted GPU — Python render suites (NVIDIA Vulkan)
    # Hosted runners skip the terrain-safe tests. This lane runs the complete
    # Python suite and fails when the adapter is missing, so render-path
    # regressions cannot merge behind a green hosted job.
    # Never execute fork PR code on a persistent runner. Same-repo PRs and
    # main pushes are trusted; fork authors can still use the hosted checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engine and test deps
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: pwsh
        run: |
          # Fresh per-job environment: a self-hosted runner must not reuse a venv.
          $venv = Join-Path $env:RUNNER_TEMP "studio-gpu-venv"
          if (Test-Path -LiteralPath $venv) { Remove-Item -Recurse -Force -LiteralPath $venv }
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$venv\Scripts\python.exe" -m pip install `
            'forge3d @ git+https://github.com/milos-agathon/forge3d.git@9804091086364a1824ea8bb0e7f9f2a172fddf45' `
            pytest pillow rasterio pyproj

      - name: pytest on the physical adapter
        shell: pwsh
        env:
          FORGE3D_TESSELLA_REQUIRED_GPU: '1'
          FORGE3D_ALLOW_HOSTED_WINDOWS_TERRAIN: '1'
          WGPU_BACKEND: vulkan
          WGPU_BACKENDS: vulkan
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "studio-gpu-venv"
          & "$venv\Scripts\python.exe" -m pytest tests/ -v --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deb-audit:
    name: deb audit — engine probe in both interpreter scenarios
    # Gate on PRs and main pushes: the deb's stranger-readable discovery path
    # is a contract, not a hope. The GPU is not required for this job — the
    # gate is the probe, never a render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf desktop-file-utils
          # dpkg -i does not fetch dependencies: carry the deb's declared
          # Depends (libgbm1, mesa-vulkan-drivers; the webkit/gtk libs come with
          # the -dev packages) so a wrong Depends fails the audit strictly.
          sudo apt-get install -y libgbm1 mesa-vulkan-drivers

      - name: Install the pinned forge3d engine in a fresh venv
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # The engine wheel excludes the Git LFS sample data.
        run: |
          sudo apt-get install -y libvulkan-dev pkg-config
          python -m venv "$HOME/stranger-venv"
          "$HOME/stranger-venv/bin/python" -m pip install --upgrade pip
          "$HOME/stranger-venv/bin/python" -m pip install \
            'forge3d @ git+https://github.com/milos-agathon/forge3d.git@9804091086364a1824ea8bb0e7f9f2a172fddf45'

      - name: Build the deb
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      - name: Install the deb as a stranger would
        run: |
          # Needs sudo (system apt), no network beyond the apt mirrors the
          # ubuntu-latest runner already trusts.
          sudo dpkg -i target/release/bundle/deb/*.deb
          command -v forge3d-studio-shell
          dpkg -L forge3-d-studio

      - name: --engine-check fails on a clean machine, naming the remedy
        run: |
          # No .venv anywhere above the checkout root and no engine in
          # ubuntu-latest's stock python3: this is the stranger's case.
          ! forge3d-studio-shell --engine-check > out.txt
          cat out.txt
          EXPECTED="pip install --user forge3d"
          grep -q "$EXPECTED" out.txt || (echo "missing remedy line in --engine-check output"; exit 1)

      - name: --engine-check succeeds with the engine in a fresh venv
        run: |
          FORGE3D_STUDIO_PYTHON="$HOME/stranger-venv/bin/python" forge3d-studio-shell --engine-check

      - name: Validate the desktop entry
        run: |
          desktop-file-validate /usr/share/applications/*.desktop

  bundle:
    name: Linux bundle (deb)
    # Packaging is a release gate, not a pull-request gate: the test job above
    # already compiles both crates, and a full release build costs minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: studio-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the deb
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: forge3d-studio-deb
          path: target/release/bundle/deb/*.deb
